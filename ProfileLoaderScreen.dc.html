<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/zharehub-design-system-d00ac0e8-fa7a-4158-a219-3d949dd7849f/tokens/fonts.css">
<link rel="stylesheet" href="_ds/zharehub-design-system-d00ac0e8-fa7a-4158-a219-3d949dd7849f/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/zharehub-design-system-d00ac0e8-fa7a-4158-a219-3d949dd7849f/tokens/typography.css">
<link rel="stylesheet" href="_ds/zharehub-design-system-d00ac0e8-fa7a-4158-a219-3d949dd7849f/styles.css">
<script src="_ds/zharehub-design-system-d00ac0e8-fa7a-4158-a219-3d949dd7849f/_ds_bundle.js"></script>
<style>@font-face{font-family:"Zoho Puvi";src:url("assets/fonts/ZohoPuvi-Regular.ttf") format("truetype");font-weight:400;font-display:swap}@font-face{font-family:"Zoho Puvi";src:url("assets/fonts/ZohoPuvi-Semibold.ttf") format("truetype");font-weight:600;font-display:swap}@font-face{font-family:"Zoho Puvi";src:url("assets/fonts/ZohoPuvi-Bold.ttf") format("truetype");font-weight:700;font-display:swap}@keyframes zhPulse{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.7);opacity:0}}@keyframes zhSpin{to{transform:rotate(360deg)}}</style>
</helmet>
<div class="{{ theme }}" style="--zh-primary: {{ pal.primary }};--zh-system-bg: {{ pal.systemBg }};position:relative;width:100%;height:100%;overflow:hidden;background:var(--zh-system-bg);font-family:'Zoho Puvi','SF Pro',-apple-system,system-ui,sans-serif">
  <sc-if value="{{ showList }}" hint-placeholder-val="{{ false }}">
    <dc-import name="AppListScreen" logo-style="{{ logoStyle }}" device="{{ device }}" appearance="{{ appearance }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import>
  </sc-if>
  <sc-if value="{{ showNoOrg }}" hint-placeholder-val="{{ false }}">
    <dc-import name="NoOrgScreen" device="{{ device }}" appearance="{{ appearance }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import>
  </sc-if>
  <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
  <img src="assets/ill_login_bg.png" alt="" style="position:absolute;left:0;top:0;width:100%;max-width:820px;pointer-events:none;opacity:{{ bgOpacity }}">
  <div style="position:relative;height:100%;display:flex;flex-direction:column">
    <sc-if value="{{ isPhone }}" hint-placeholder-val="{{ true }}">
      <x-import component-from-global-scope="ZhareHubDesignSystem_d00ac0.StatusBarIPhone2" hint-size="402px,62px"></x-import>
    </sc-if>
    <sc-if value="{{ isPad }}" hint-placeholder-val="{{ false }}">
      <div style="height:32px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;font-family:'SF Pro',-apple-system,system-ui,sans-serif;font-size:15px;font-weight:600;letter-spacing:-0.24px;color:var(--labels-primary)">
        <div style="display:flex;gap:8px"><span>9:41</span><span>Mon Jun 10</span></div>
        <div style="display:flex;align-items:center;gap:6px"><span>100%</span><span style="width:25px;height:12px;border-radius:4px;border:1px solid var(--labels-tertiary);padding:1.5px;box-sizing:border-box;display:flex"><span style="flex:1;border-radius:2px;background:var(--labels-primary)"></span></span></div>
      </div>
    </sc-if>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:0 32px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center">
        <div style="position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center">
          {{ effects }}
          <div style="position:relative;width:96px;height:96px;border-radius:100px;background:var(--accents-orange);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:600;letter-spacing:0.4px;color:#fff">{{ initials }}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;max-width:320px">
          <div style="font-size:28px;font-weight:700;line-height:34px;letter-spacing:0.36px;color:var(--labels-primary);text-wrap:pretty">Welcome, {{ firstName }}</div>
          <div style="font-size:17px;line-height:22px;letter-spacing:-0.41px;color:var(--labels-secondary);text-wrap:pretty">We’re getting the app set up for you.</div>
        </div>
      </div>
    </div>
    <div style="display:flex;justify-content:center">
      <x-import component-from-global-scope="ZhareHubDesignSystem_d00ac0.HomeIndicator" device="{{ hiDevice }}" orientation="{{ hiOrientation }}" hint-size="400px,34px"></x-import>
    </div>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:874},&quot;device&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;iPhone&quot;,&quot;iPad&quot;],&quot;default&quot;:&quot;iPhone&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;appearance&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Light&quot;,&quot;Dark&quot;],&quot;default&quot;:&quot;Light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;outcome&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Organization found&quot;,&quot;No organization&quot;],&quot;default&quot;:&quot;Organization found&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;API result&quot;},&quot;autoAdvance&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;API result&quot;},&quot;duration&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:800,&quot;max&quot;:5000,&quot;step&quot;:100,&quot;unit&quot;:&quot;ms&quot;,&quot;default&quot;:2200,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;API result&quot;},&quot;effect&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Loader on stroke&quot;,&quot;Pulse&quot;],&quot;default&quot;:&quot;Pulse&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Alex Rivera&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onDone&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;logoStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Filled&quot;,&quot;Stroke&quot;],&quot;default&quot;:&quot;Filled&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { done: false };
  componentDidMount() { this.arm(); }
  componentDidUpdate(p) { if (p.autoAdvance !== this.props.autoAdvance || p.outcome !== this.props.outcome) { this.setState({ done: false }); this.arm(); } }
  componentWillUnmount() { clearTimeout(this.t); }
  arm() {
    clearTimeout(this.t);
    if (this.props.autoAdvance === false) return;
    this.t = setTimeout(() => { this.setState({ done: true }); this.props.onDone && this.props.onDone(); }, this.props.duration ?? 2200);
  }
  effects() {
    const h = React.createElement;
    const ring = d => h('div', { key: 'p' + d, style: { position: 'absolute', left: 12, top: 12, width: 96, height: 96, borderRadius: 100, background: 'var(--accents-orange)', animation: 'zhPulse 2s cubic-bezier(0.2,0.6,0.4,1) ' + d + 's infinite', pointerEvents: 'none' } });
    const C = 2 * Math.PI * 56;
    const arc = h('svg', { key: 'arc', width: 120, height: 120, viewBox: '0 0 120 120', style: { position: 'absolute', inset: 0, animation: 'zhSpin 1.1s linear infinite' } },
      h('circle', { cx: 60, cy: 60, r: 56, fill: 'none', stroke: 'var(--fills-secondary)', strokeWidth: 3 }),
      h('circle', { cx: 60, cy: 60, r: 56, fill: 'none', stroke: 'var(--zh-primary)', strokeWidth: 3, strokeLinecap: 'round', strokeDasharray: (C * 0.28) + ' ' + C }));
    return (this.props.effect ?? 'Pulse') === 'Pulse' ? [ring(0), ring(1)] : [arc];
  }
  renderVals() {
    const dark = this.props.appearance === 'Dark';
    const pad = this.props.device === 'iPad';
    const name = this.props.userName || 'Alex Rivera';
    const noOrg = this.props.outcome === 'No organization';
    const done = this.state.done;
    return {
      logoStyle: this.props.logoStyle ?? 'Filled',
      device: pad ? 'iPad' : 'iPhone', appearance: dark ? 'Dark' : 'Light', theme: dark ? 'dark' : '',
      isPad: pad, isPhone: !pad, hiDevice: pad ? 'iPad' : 'iPhone', hiOrientation: pad ? 'landscape' : 'portrait',
      bgOpacity: dark ? 0.22 : 1,
      pal: dark ? { systemBg: '#1E1E1E', primary: '#2F80CC' } : { systemBg: '#F7F7F7', primary: '#226DB4' },
      initials: name.split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase(),
      firstName: name.split(/\s+/)[0], effects: this.effects(),
      loading: !done, showList: done && !noOrg, showNoOrg: done && noOrg,
    };
  }
}
</script>
</body>
</html>
